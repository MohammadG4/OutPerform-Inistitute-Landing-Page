<header class="navbar" id="site-navbar">
  <style>
    /* ================= DESIGN SYSTEM TOKENS FOR NAVBAR ================= */
    :root {
      --bg-light: #F8FAFC;
      --bg-white: #FFFFFF;
      --bg-subtle: #F1F5F9;
      --border-color: #E2E8F0;
      --text-primary: #0F172A;
      --text-muted: #475569;
      --text-subtle: #64748B;
      --green-text: rgb(59, 126, 68);
      --green-btn: rgb(103, 202, 77);
      --green-btn-hover: rgb(84, 176, 58);
      --font-main: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --container-max: 1200px;
      --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.04);
      --shadow-md: 0 10px 25px -5px rgba(15, 23, 42, 0.06), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
      --transition: all 0.2s ease-in-out;
    }

    .container { width: 100%; max-width: var(--container-max); margin: 0 auto; padding: 0 24px; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 13px 26px; font-weight: 700; font-size: 0.95rem; border-radius: 8px;
      cursor: pointer; transition: var(--transition); border: 1.5px solid transparent;
      white-space: nowrap; user-select: none;
    }
    .btn-accent { background-color: var(--green-btn); color: #FFF; border-color: var(--green-btn); box-shadow: 0 4px 14px rgba(103, 202, 77, 0.35); }
    .btn-accent:hover { background-color: var(--green-btn-hover); border-color: var(--green-btn-hover); transform: translateY(-1px); box-shadow: 0 6px 20px rgba(103, 202, 77, 0.45); }

    /* ================= NAVBAR ================= */
    .navbar {
      position: sticky; top: 0; z-index: 1000; background-color: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color); height: 74px; display: flex; align-items: center;
      transition: box-shadow 0.3s ease; font-family: var(--font-main); width: 100%;
    }
    .navbar.scrolled { box-shadow: 0 6px 24px -12px rgba(15, 23, 42, 0.18); }
    .navbar-container { display: flex; align-items: center; justify-content: space-between; width: 100%; }
    .brand-logo img { height: 34px; width: auto; display: block; }
    .nav-links { display: flex; align-items: center; gap: 28px; list-style: none; margin: 0; padding: 0; }
    .nav-link { font-size: 0.92rem; font-weight: 600; color: var(--text-muted); text-decoration: none; padding: 4px 0; position: relative; }
    .nav-link::after {
      content: ""; position: absolute; left: 0; bottom: -2px; height: 2px; width: 100%;
      background: var(--green-btn); border-radius: 2px;
      transform: scaleX(0); transform-origin: left; transition: transform 0.25s ease;
    }
    .nav-link:hover, .nav-link.active { color: var(--text-primary); }
    .nav-link:hover::after, .nav-link.active::after { transform: scaleX(1); }
    .mobile-toggle { display: none; background: none; border: none; color: var(--text-primary); cursor: pointer; }

    @media (max-width: 992px) {
      .nav-links, .nav-cta { display: none; }
      .mobile-toggle {
        display: inline-flex !important;
        align-items: center; justify-content: center;
        background: none; border: none;
        color: var(--text-primary); cursor: pointer;
        padding: 8px; margin-right: -8px;
        z-index: 1002; position: relative;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }
      .nav-links.mobile-open {
        display: flex !important;
        flex-direction: column !important;
        position: absolute !important;
        top: 74px !important; left: 0 !important; right: 0 !important;
        width: 100% !important;
        background: var(--bg-white) !important;
        border-bottom: 1px solid var(--border-color) !important;
        padding: 24px !important; gap: 16px !important;
        box-shadow: 0 12px 30px -10px rgba(15, 23, 42, 0.15) !important;
        z-index: 1001 !important;
        visibility: visible !important;
        opacity: 1 !important;
      }
      .nav-links.mobile-open .nav-link {
        font-size: 1.05rem;
        padding: 8px 0;
        width: 100%;
        display: block;
      }
    }
  </style>

  <div class="container navbar-container">
    <a href="home.html" class="brand-logo" aria-label="OutPerform Institute Home">
      <img src="https://assets.cdn.filesafe.space/Ij1AeSf44iidSOUYTiDZ/media/69b1cedd8d3eae7c26247ab7.png" alt="OutPerform Institute Logo" />
    </a>

    <nav>
      <ul class="nav-links" id="nav-menu">
        <li><a href="home.html" class="nav-link">Home</a></li>
        <li><a href="Services.html" class="nav-link">Services</a></li>
        <li><a href="About Us .html" class="nav-link">About Us</a></li>
        <li><a href="Booking.html" class="nav-link">Booking</a></li>
        <li><a href="Contact.html" class="nav-link">Contact Us</a></li>
        <li><a href="/blog" class="nav-link">Blog</a></li>
      </ul>
    </nav>

    <div class="nav-cta">
      <button onclick="typeof openBookingModal === 'function' ? openBookingModal() : (window.location.href='Booking.html')" class="btn btn-accent">Book a Brief</button>
    </div>

    <button class="mobile-toggle" id="mobile-toggle-btn" onclick="toggleMobileMenu(event)" aria-label="Toggle navigation menu">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
  </div>

  <script>
    /* ============ MOBILE NAV TOGGLE (GLOBAL FUNCTION FOR TOUCH & CLICK) ============ */
    window.toggleMobileMenu = function(e) {
      if (e) {
        e.preventDefault();
        e.stopPropagation();
      }
      const navMenu = document.getElementById("nav-menu");
      if (navMenu) {
        navMenu.classList.toggle("mobile-open");
      }
    };

    (function() {
      /* ============ BACKUP EVENT BINDING FOR TOUCH / CLICK ============ */
      function initToggle() {
        const toggleBtn = document.getElementById("mobile-toggle-btn");
        const navMenu = document.getElementById("nav-menu");
        if (toggleBtn && navMenu) {
          toggleBtn.onclick = window.toggleMobileMenu;
        }
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", initToggle);
      } else {
        initToggle();
      }

      /* ============ CLOSE MENU ON OUTSIDE CLICK / TOUCH ============ */
      document.addEventListener("click", function(e) {
        const navMenu = document.getElementById("nav-menu");
        const toggleBtn = document.getElementById("mobile-toggle-btn");
        if (navMenu && navMenu.classList.contains("mobile-open")) {
          if (!navMenu.contains(e.target) && !toggleBtn.contains(e.target)) {
            navMenu.classList.remove("mobile-open");
          }
        }
      });

      /* ============ NAVBAR SCROLL SHADOW ============ */
      const navbar = document.getElementById("site-navbar");
      if (navbar) {
        const onScroll = function() {
          const top = window.scrollY || document.documentElement.scrollTop;
          navbar.classList.toggle("scrolled", top > 10);
        };
        window.addEventListener("scroll", onScroll, { passive: true });
        onScroll();
      }

      /* ============ DYNAMIC ACTIVE LINK HIGHLIGHT ============ */
      const navLinks = document.querySelectorAll("#nav-menu .nav-link");
      const currentPath = decodeURIComponent(window.location.pathname.toLowerCase());
      const currentHref = decodeURIComponent(window.location.href.toLowerCase());

      let matched = false;

      navLinks.forEach(link => {
        const rawHref = link.getAttribute("href");
        if (!rawHref) return;
        const href = decodeURIComponent(rawHref.toLowerCase());

        const cleanHref = href.split("?")[0].split("#")[0];
        const filename = cleanHref.split("/").pop();

        let isActive = false;

        if (cleanHref && (currentPath.endsWith(cleanHref) || currentHref.endsWith(cleanHref))) {
          isActive = true;
        } else if (filename) {
          if (currentPath.endsWith("/" + filename) || currentHref.endsWith("/" + filename)) {
            isActive = true;
          } else if (filename.includes("home") && (currentPath.includes("home") || currentPath === "/" || currentPath.endsWith("/"))) {
            isActive = true;
          } else if (filename.includes("about") && (currentPath.includes("about") || currentHref.includes("about"))) {
            isActive = true;
          } else if (filename.includes("services") && currentPath.includes("services")) {
            isActive = true;
          } else if (filename.includes("booking") && currentPath.includes("booking")) {
            isActive = true;
          } else if (filename.includes("contact") && currentPath.includes("contact")) {
            isActive = true;
          } else if (filename.includes("blog") && currentPath.includes("blog")) {
            isActive = true;
          }
        }

        if (isActive && !matched) {
          link.classList.add("active");
          matched = true;
        } else {
          link.classList.remove("active");
        }
      });

      if (!matched && (currentPath === "/" || currentPath.endsWith("/") || currentPath.endsWith("/index.html"))) {
        const homeLink = document.querySelector('#nav-menu .nav-link[href*="home"]');
        if (homeLink) homeLink.classList.add("active");
      }
    })();
  </script>
</header>
